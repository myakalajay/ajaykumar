# Auto-deploy: every push to main builds the site and publishes the static
# page to GitHub Pages.
#
# One-time setup (Repository → Pages → Build and deployment):
#   Source:        GitHub Actions
#   Build option:  Deploy from a branch  ← the workflow below publishes dist/
#
# Optional repository variables (Settings → Secrets and variables → Actions):
#   SITE_URL  — canonical origin, e.g. https://myakalajay.github.io/ajaykumar
#   When it is unset the build emits none of <link rel="canonical"> /
#   og:url / sitemap <loc> entries rather than guessing an origin.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SITE_URL is a repository variable, not a secret — no token is exposed.
      - name: Typecheck & build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Upload deploy artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
