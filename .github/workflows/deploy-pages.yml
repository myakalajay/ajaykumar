# Auto-deploy: every push to main builds the site and publishes the static
# page to GitHub Pages.
#
# One-time setup (Repository → Pages → Build and deployment):
#   Source:        GitHub Actions
#   Build option:  Deploy from a branch  ← the workflow below publishes dist/
#
# The Worker (worker/wrangler.toml) serves this same `dist/` as assets,
# so Pages and the Worker are guaranteed to render identical content.
#
# Optional repository *variable* (Settings → Secrets and variables → Actions):
#   SITE_URL  — canonical origin, e.g. https://ajaykumar.dev. When it is unset
#   the build emits none of <link rel="canonical"> / og:url / sitemap <loc>
#   entries rather than guessing an origin.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — API token with Edit Cloudflare Workers permission
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
#   D1_DATABASE_ID         — id of the ajay-admin D1 database to bind

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SITE_URL is a repository variable, not a secret — no token is exposed.
      - name: Typecheck & build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Upload deploy artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
